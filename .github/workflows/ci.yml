name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

# Cancel superseded runs on the same ref (PR or branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      # Arch's rolling `clang` package is the pinned major; the guard fails loudly when Arch moves on.
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git just clang python
          clang-format --version | grep -q 'version 23\.' || { clang-format --version; echo "error: expected clang-format 23" >&2; exit 1; }

      - uses: actions/checkout@v6

      - name: Check formatting and prose
        run: just format-check

      - name: Check palette role alpha
        run: just role-alpha-check

  build:
    name: Build and test (debug)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git meson ninja pkgconf ccache zstd \
            wayland wayland-protocols \
            libglvnd freetype2 fontconfig noto-fonts \
            cairo pango harfbuzz \
            libxkbcommon glib2 glib-networking gvfs dbus shared-mime-info \
            gdk-pixbuf2 glycin libheif libwebp librsvg libpng \
            tomlplusplus acl libarchive xz curl libxml2 \
            nlohmann-json stb \
            python ffmpeg ffmpegthumbnailer poppler 7zip \
            just clang

      - uses: actions/checkout@v6

      # Meson picks up ccache automatically. Only pushes to main save the cache, so
      # PR runs reuse it without evicting each other from the repository quota.
      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-arch-${{ github.sha }}
          restore-keys: ccache-arch-

      - name: Build
        run: just build

      - name: Test
        run: just test debug

      - name: Save ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-arch-${{ github.sha }}

      - name: Check clang-tidy version
        run: |
          clang-tidy --version | grep -q 'version 23\.' || { clang-tidy --version; echo "error: expected clang-tidy 23" >&2; exit 1; }

      - name: Lint
        run: just lint
